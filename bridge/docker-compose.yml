# Stallwache-Bridge: go2rtc (RTSP -> WebRTC/HLS) im Stall-LAN.
#
# go2rtc selbst ist NIE oeffentlich. Von aussen kommt das Bild nur ueber den
# Fernzugriff: Tailscale Funnel :8443 -> fern-proxy.py (Token) -> go2rtc,
# eingerichtet mit `bash fern-einrichten.sh` (siehe README.md hier und
# docs/fernzugriff-spezifikation.md). Kein Cloudflare-Tunnel mehr.
#
# Start:   cd bridge && cp .env.example .env  (Werte eintragen) && docker compose up -d --remove-orphans
# Logs:    docker compose logs -f
# Stop:    docker compose down

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: stallwache-go2rtc
    restart: unless-stopped
    network_mode: host # noetig fuer WebRTC/RTSP im LAN
    environment:
      TAPO_IP: ${TAPO_IP}
      TAPO_USER: ${TAPO_USER}
      TAPO_PASS: ${TAPO_PASS}
      FUTTER_IP: ${FUTTER_IP:-}
      FUTTER_USER: ${FUTTER_USER:-}
      FUTTER_PASS: ${FUTTER_PASS:-}
      # Login der go2rtc-Schnittstelle (leer = ohne Login, wie bisher).
      GO2RTC_API_USER: ${GO2RTC_API_USER:-}
      GO2RTC_API_PASS: ${GO2RTC_API_PASS:-}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
