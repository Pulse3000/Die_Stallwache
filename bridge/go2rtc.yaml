# go2rtc – RTSP -> WebRTC/HLS Bridge fuer die Tapo TCA72
# Laeuft im Stall-Netzwerk (selber LAN wie die Kamera).
#
# Die Tapo TCA72 stellt zwei RTSP-Streams bereit (Kamera-Konto erforderlich,
# in der Tapo-App unter "Erweiterte Einstellungen" -> "Kamerakonto" aktivieren):
#   stream1 = HD  (Hauptstream)
#   stream2 = SD  (niedrige Bandbreite, ideal fuer Mobilfunk)
#
# Zugangsdaten werden ueber Umgebungsvariablen injiziert (siehe docker-compose.yml),
# damit keine Klartext-Passwoerter im Repo liegen.

streams:
  stallwache:
    - rtsp://${TAPO_USER}:${TAPO_PASS}@${TAPO_IP}:554/stream1
  stallwache_sd:
    - rtsp://${TAPO_USER}:${TAPO_PASS}@${TAPO_IP}:554/stream2
  # Zweitkamera "Futterwache" (Vorschau in Stallblick)
  futterwache:
    - rtsp://${FUTTER_USER}:${FUTTER_PASS}@${FUTTER_IP}:554/stream1
  futterwache_sd:
    - rtsp://${FUTTER_USER}:${FUTTER_PASS}@${FUTTER_IP}:554/stream2

api:
  listen: ":1984"
  # Login (bridge/.env: GO2RTC_API_USER/GO2RTC_API_PASS). Ohne Login nimmt
  # die API aus dem ganzen Stall-WLAN Befehle an — auch „einfache“ POSTs einer
  # beliebigen Webseite, die ein Geraet im WLAN oeffnet (go2rtc beenden, Bild
  # an fremden Server weiterleiten). Fehlendes CORS verhindert nur das Lesen
  # der Antwort, nicht das Senden. Anfragen vom Stall-Rechner selbst
  # (fern-proxy.py ueber 127.0.0.1) brauchen keinen Login (local_auth aus).
  # NIE `tailscale serve`/`funnel` direkt auf 1984: kaeme als 127.0.0.1 an
  # und umginge den Login. Leer = ohne Login (Verhalten wie bisher).
  username: "${GO2RTC_API_USER:}"
  password: "${GO2RTC_API_PASS:}"
  # Bewusst KEIN `origin: "*"` (docs/fernzugriff-spezifikation.md §1.2).

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    # WebRTC nur im LAN/Tailnet. Von aussen laeuft ausschliesslich HLS ueber
    # den Fernzugriff (fern-proxy.py hinter Tailscale Funnel :8443).
    - stun:8555

log:
  level: info
