# Stallblick-Bridge (MediaMTX-Variante) + lokaler Caddy-Reverse-Proxy.
#
# Alternative zu /bridge/docker-compose.yml (go2rtc). Nur im LAN/Tailnet
# erreichbar: Der Fernzugriff (fern-proxy.py hinter Tailscale Funnel) kennt
# nur go2rtc-Pfade, und ein Cloudflare-Tunnel ist nicht mehr vorgesehen
# (docs/fernzugriff-spezifikation.md §2). Entscheidungshilfe: /bridge/README.md
#
# Warum Caddy zusaetzlich? MediaMTX bedient HLS (8888) und WebRTC/WHEP (8889)
# auf getrennten Ports. Caddy vereint beide lokal unter Port 1984 (wie beim
# go2rtc-Setup), damit Geraete im Tailnet nur EINE Adresse brauchen.
#
# Start:   cd bridge/mediamtx && cp .env.example .env  (Werte eintragen) && docker compose up -d --remove-orphans
# Logs:    docker compose logs -f
# Stop:    docker compose down

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: stallwache-mediamtx
    restart: unless-stopped
    network_mode: host # noetig fuer WebRTC/RTSP im LAN
    environment:
      TAPO_IP: ${TAPO_IP}
      TAPO_USER: ${TAPO_USER}
      TAPO_PASS: ${TAPO_PASS}
      FUTTER_IP: ${FUTTER_IP:-}
      FUTTER_USER: ${FUTTER_USER:-}
      FUTTER_PASS: ${FUTTER_PASS:-}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  caddy:
    image: caddy:2
    container_name: stallwache-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mediamtx
