# Edge-Agent auf dem Stall-Rechner, eine Instanz je Kamera
# (docs/ein-edge-agent-spezifikation.md). Daten und config.yaml liegen in
# daten/<kamera>/ (gitignoriert).
#
#   Start:   docker compose up -d --build              # Kamera stallwache
#   Weitere: KAMERA=futterwache docker compose -p futterwache up -d
#   Analyse: ANALYSE=1 docker compose up -d --build    # erst mit eigenem Modell
#   Logs:    docker compose logs -f
#
# Umstieg von kuhwatch: deploy/umstieg-von-kuhwatch.sh
services:
  agent:
    build:
      context: .
      args:
        ANALYSE: "${ANALYSE:-0}"
    image: stallwache-agent:${ANALYSE:-0}
    container_name: stallwache-agent-${KAMERA:-stallwache}
    restart: unless-stopped
    # Host-Netz: go2rtc-Restream und Snapshot-API auf localhost erreichbar.
    network_mode: host
    volumes:
      - ./daten/${KAMERA:-stallwache}:/daten
      # KI-Ansicht (Kaesten fuers Livebild) im RAM des Stall-Rechners: eine
      # kleine JSON-Datei je Sekunde ohne Plattenverschleiss; fern-proxy.py
      # liest sie dort (Default /dev/shm/stallwache-stallwache/ki-kaesten.json).
      - /dev/shm/stallwache-${KAMERA:-stallwache}:/ki-ansicht
    environment:
      # Fehlersuche: OPENCV_FFMPEG_LOGLEVEL=16 docker compose up -d
      # (README „Ruhiges Log"). Ohne Wert gilt 8 = nur fatal.
      - OPENCV_FFMPEG_LOGLEVEL
      # Gilt, wenn config.yaml ki_ansicht.datei leer laesst. Abschalten (z. B.
      # Futterwache, die keine Kachel abruft): KI_ANSICHT_DATEI= docker compose …
      - KI_ANSICHT_DATEI=${KI_ANSICHT_DATEI-/ki-ansicht/ki-kaesten.json}
    # Wie kuhwatch: flache CPU-Last statt thermischer Lastspitzen.
    cpus: 1
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
