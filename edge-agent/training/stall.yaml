# YOLOv8-Pose-Datensatz fuer die KI-Wache (Ultralytics-Format).
# Reihenfolge von Klassen und Keypoints MUSS zu config.yaml passen
# (modell.klassen / modell.keypoints) — sonst misst der Agent falsche Winkel.
#
# Ordnerstruktur nach dem CVAT-Export (Format "Ultralytics YOLO Pose"):
#   datensatz/images/train/*.jpg   datensatz/labels/train/*.txt
#   datensatz/images/val/*.jpg     datensatz/labels/val/*.txt
path: datensatz
train: images/train
val: images/val

names:
  0: kuh
  1: amniotic_sac   # Fruchtblase – nur eindeutige Faelle labeln (Sofort-Alarm!)
  2: calf_legs      # Kaelberfuesse – nur eindeutige Faelle labeln (Sofort-Alarm!)

# 3 Keypoints je Objekt, jeweils (x, y, sichtbar).
# Fuer amniotic_sac/calf_legs Keypoints als "nicht sichtbar" (0 0 0) lassen.
kpt_shape: [3, 3]
# 0 spine_end (Nacken/Ruecken), 1 tail_base (Schwanzansatz), 2 tail_tip.
# Keine links/rechts-Paare -> beim horizontalen Spiegeln bleibt alles gleich.
flip_idx: [0, 1, 2]
