# Konfiguration des Stallblick-Edge-Agenten (Brunst- & Kalbeerkennung).
# Kopieren nach config.yaml und Werte anpassen:  cp config.example.yaml config.yaml

stream:
  # go2rtc stellt neben WebRTC/HLS auch einen RTSP-Restream bereit (Port 8554).
  # IP des Bridge-Rechners im Stall-LAN eintragen:
  url: rtsp://192.168.178.50:8554/stallwache
  # Fallback, falls RTSP nicht klappt: Snapshot-Polling ueber die go2rtc-API.
  # Mit go2rtc-Login (bridge/.env GO2RTC_API_USER/PASS):
  #   http://BENUTZER:PASSWORT@192.168.178.50:1984/api/frame.jpeg?src=stallwache
  # Der Agent schickt die Daten als Basic-Auth und schreibt sie nie ins Log.
  fallback_snapshot_url: http://192.168.178.50:1984/api/frame.jpeg?src=stallwache
  # --- Cloud-Quelle OHNE Bridge (Kameras, die schon in der Tuya-Cloud
  # haengen: Stallwache, Futterwache, Abkalbebox, Weidewache). Alle drei Werte
  # setzen, url oben leer lassen -> der Agent holt sich die kurzlebige HLS-URL
  # selbst und erneuert sie bei jedem Reconnect. Damit laeuft der Silent Mode
  # ohne Bridge.
  #
  # Fuer die vollstaendige Kalbe- und Brunstueberwachung ohne Bridge:
  #   quelle_api: /api/stallwache/stream
  # Voraussetzung in der Webapp: TUYA_DEVICE_ID_STALLWACHE gesetzt und
  # NEXT_PUBLIC_STALLWACHE_TUYA=1. Dann sehen App und Agent dieselbe Quelle.
  # NICHT bei aktivem Fernzugriff (STALLWACHE_FERN_*): Dann liefert
  # /api/stallwache/stream eine Adresse hinter dem App-Login, die die
  # Cloud-Quelle nicht lesen kann — im Stall stattdessen stream.url (RTSP).
  #
  # app_passwort = STALLBLICK_PASSWORT der Webapp (config.yaml ist
  # gitignoriert und wird von setup.sh mit 600er-Rechten angelegt).
  app_url: ""            # z. B. https://stallwache.vercel.app
  quelle_api: ""         # z. B. /api/stallwache/stream (Abkalbebereich),
                         #       /api/futterwache/stream oder /api/abkalbebox/stream
  app_passwort: ""
  # Kamera-Name fuer Meldungen
  # (stallwache | futterwache | abkalbebox | weidewache)
  kamera: stallwache
  # 1 Frame/Sekunde reicht voellig: Kalbeanzeichen entwickeln sich ueber
  # Minuten – so laeuft die Analyse auch auf einem alten Laptop ohne GPU.
  ziel_fps: 1.0
  # Stream-Totmann-Meldung: liefert der Stream laenger als diese Zeit kein
  # Bild, geht GENAU EINE Telegram-Nachricht raus („das dritte Auge ist
  # blind") und eine Entwarnung, sobald er zurueck ist. 0 = deaktiviert.
  totmann_minuten: 5

modell:
  # Pfad zum trainierten YOLO-Pose-Modell (best.pt aus dem Colab-Training).
  # Leer lassen -> Silent Mode: Agent sammelt nur Trainingsbilder.
  pfad: ""
  # Keypoint-Indizes im eigenen Modell (Reihenfolge aus dem CVAT-Skeleton).
  keypoints:
    spine_end: 0   # Nacken / Ruecken
    tail_base: 1   # Schwanzansatz
    tail_tip: 2    # Schwanzspitze
  # Klassen-Indizes der Objekterkennung
  klassen:
    kuh: 0
    amniotic_sac: 1  # Fruchtblase
    calf_legs: 2     # Kaelberfuesse
  # ByteTrack-Konfiguration. Empfohlen: die mitgelieferte, auf Kuehe bei
  # 1 FPS abgestimmte tracker-kuh.yaml (grosser track_buffer gegen
  # ID-Wechsel bei Verdeckung — jede neue ID setzt das 30-Minuten-Fenster
  # zurueck!). Leer lassen -> Ultralytics-Default (bytetrack.yaml).
  # Feineinstellung & Verifikation: Skill `bytetrack-tuning`.
  tracker: tracker-kuh.yaml

logik:
  winkel_schwelle_grad: 45     # Schwanzwinkel-Schwelle
  fenster_minuten: 30          # rollierendes Zeitfenster
  anteil_schwelle: 0.20        # >20 % der Frames ueber Schwelle -> Kalbeverdacht
  override_konfidenz: 0.80     # Fruchtblase/Fuesse ab dieser Konfidenz -> Sofort-Alarm
  brunst_min_dauer_s: 4        # Aufsprung muss so lange anhalten (filtert Spielverhalten)
  eskalation_minuten: 60       # Austreibung ohne Fortschritt nach dieser Zeit -> Kontroll-Alarm
  # Erinnerungstakt waehrend einer laufenden Austreibung ("laeuft weiter seit
  # N min"), solange Fruchtblase/Fuesse sichtbar sind. Leer = wie
  # telegram.cooldown_minuten. Austreibung laeuft NIE durch den Cooldown.
  austreibung_erinnerung_minuten:
  # Wach-Modus: ~14 Tage vor dem Kalbetermin aktivieren. Senkt die Schwellen
  # (frueherer Kalbeverdacht, kuerzere Brunst-Mindestdauer) - danach wieder aus,
  # damit der Alltag ruhig bleibt.
  wach_modus: false

telegram:
  token: ""        # von @BotFather
  chat_id: ""      # von @userinfobot
  cooldown_minuten: 15
  # Bildserie pro Alarm (letzte N Frames als Album, macht Fehlalarme am
  # Handy sofort erkennbar). 1 = nur Einzelbild.
  bildserie_frames: 4
  # Taeglicher Statusbericht (1 Nachricht: Ereigniszaehler, Uptime, Modus).
  # Leer lassen zum Deaktivieren.
  digest_uhrzeit: "20:00"
  # Ein-Tipp-Feedback: Inline-Buttons "Treffer/Fehlalarm" unter jedem Alarm.
  # Ein Tipp auf Fehlalarm legt die unannotierte Bildserie als Hard Negatives
  # fuers Nachtraining ab (Skill fehlalarm-triage). Nutzt getUpdates —
  # der Bot darf daneben keinen Telegram-Webhook betreiben.
  feedback_buttons: true
  # Ablageort der Fehlalarm-Bilder (Unterordner pro Tag)
  fehlalarm_ordner: ./aufnahmen/fehlalarme

dashboard:
  # Stallblick-KI-Wache auf Vercel; leer lassen zum Deaktivieren.
  url: https://stallwache.vercel.app/api/events
  token: ""        # muss EDGE_INGEST_TOKEN in Vercel entsprechen

  # Alarmbilder an die App mitschicken (Bild-Replay im Aktivitaetsprotokoll).
  # 0 = nur Text senden, wenn die Uplink-Leitung zu schmal ist.
  bilder: 3

  # Offline-Puffer: was bei Netzausfall nicht rausging, wird beim naechsten
  # Kontakt als Stapel nachgeliefert - mit dem urspruenglichen Zeitstempel.
  # Ueberlebt auch einen Neustart des Agenten.
  puffer_datei: alarm-puffer.jsonl
  puffer_max: 200

  # Lebenszeichen an die App (Minuten; 0 = aus): Agent lebt, Modus
  # (Analyse/Silent), Kamera liefert Bild. Ohne Lebenszeichen sagt die
  # Statusabfrage (GET /api/stall-status) nie „OK", sondern „UNBEKANNT" -
  # Schweigen darf nicht „alles ruhig" bedeuten. Laeuft im Hintergrund,
  # blockiert die Analyse nie. Wechsel (Bild weg/da) gehen nach ~30 s raus.
  lebenszeichen_minuten: 5

  # Zweitkopie der Trainingsbilder in Google Cloud Storage.
  # Silent-Mode-Aufnahmen und per Feedback markierte Fehlalarm-Bilder liegen
  # sonst NUR auf der Platte des Stallrechners - meist ein ausgemusterter
  # Laptop ohne Backup. Geht sie kaputt, ist die Sammelarbeit mehrerer Wochen
  # weg. Mit archiv: true gehen sie zusaetzlich ueber die Webapp nach GCS
  # (dort GCS_BUCKET + GCP_SERVICE_ACCOUNT_JSON setzen).
  # Der Upload laeuft in einem Hintergrund-Thread und blockiert die
  # Analyseschleife nie; die lokale Kopie bleibt immer die massgebliche.
  archiv: false
  # Default: url mit /api/events -> /api/datensatz. Nur setzen, wenn das
  # Archiv woanders liegt als der Ereignis-Ingest.
  archiv_url: ""

mqtt:
  # Optionaler stiller Zusatzausgang (z.B. Home Assistant / Node-RED).
  # host leer lassen zum Deaktivieren - Telegram bleibt der primaere Alarmweg.
  host: ""
  port: 1883
  username: ""
  password: ""
  # Ereignisse erscheinen als JSON unter <basis_topic>/<kamera>/<typ>
  basis_topic: stallblick

watchdog:
  # Freeze-Watchdog: erkennt eingefrorene und gestoerte (Streifen) Kamerabilder.
  # Genau EINE Meldung beim Ausfall (Telegram + Dashboard) und eine bei
  # Erholung. Solange die Kamera defekt ist, werden keine Trainingsbilder
  # gespeichert und nichts analysiert. Je Kamera ein Watchdog: Die
  # Futterwache laeuft als eigene Agent-Instanz (stream.kamera: futterwache).
  aktiv: true
  # Anzahl gleicher/gestoerter Bilder in Folge bis zur Meldung. Leer lassen:
  #   Silent Mode   5   (geprueft wird jedes gespeicherte Trainingsbild, also
  #                      5 x silent_mode.intervall_sekunden, z. B. 10 min)
  #   Analyse-Modus 300 (jeder Frame bei ~1 FPS, also ~5 min)
  frames_bis_alarm:

silent_mode:
  # Ohne Modell werden regelmaessig Bilder fuer das spaetere Training gesammelt.
  ordner: ./aufnahmen
  intervall_sekunden: 120
